name: Cypress E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    env:
      ALLOW_DEGRADED_STARTUP: "1"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_KEY: "placeholder_key"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv slowapi \
                      supabase==2.22.4 storage3==2.22.4 \
                      requests httpx apscheduler
          pip install -r backend/requirements.txt --ignore-requires-python || true

      - name: Start backend server
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci || npm install

      - name: Start frontend dev server
        run: |
          cd Frontend && npm run dev &
          sleep 5

      - name: Cypress install
        working-directory: Frontend
        run: npx cypress install

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: Frontend
          install: false
          wait-on: "http://localhost:5173, http://localhost:8000/health"
          wait-on-timeout: 60
          browser: chrome
          record: false

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: Frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: Frontend/cypress/videos
          retention-days: 7
